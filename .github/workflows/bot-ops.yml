name: Discloud Bot Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform (audit or deploy)'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - deploy
  push:
    branches:
      - bot-migration-ops

permissions:
  contents: read

jobs:
  audit_live_infrastructure:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'audit')
    runs-on: ubuntu-latest
    environment:
      name: discloud-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Live Discloud Audit (Read-Only)
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: node scripts/bot-audit-live.mjs

  sequential_replacement:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: discloud-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decrypt Deployment Artifacts
        run: |
          mkdir -p /tmp/deploy_zips
          openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"ProjectNoxSecureDiscloudRecovery2026!" -in encrypted_deploy_payload.enc | tar -xzf - -C /tmp/deploy_zips
          ls -la /tmp/deploy_zips

      - name: Run Sequential Bot Replacement (G7-G10)
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DEPLOY_ZIPS_DIR: /tmp/deploy_zips
        run: node scripts/bot-sequential-replacement.mjs

      - name: Upload Encrypted Migration Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-migration-summary
          path: /tmp/migration_summary.enc
          retention-days: 7
