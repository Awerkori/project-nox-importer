name: Discloud Bot Operations

on:
  push:
    branches:
      - bot-migration-ops
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory_and_backup:
    runs-on: ubuntu-latest
    environment:
      name: discloud-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Bot Inventory and Backup
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: node scripts/bot-inventory-backup.mjs

      - name: Upload Encrypted Bot Backups
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-bot-backups
          path: /tmp/encrypted_bot_backups.enc
          retention-days: 1
