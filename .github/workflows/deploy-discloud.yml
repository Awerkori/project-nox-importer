name: Deploy DIScloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discloud-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production deploys must always use the reviewed main ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: discloud-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify deployment credential is configured
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          if [ -z "${DISCLOUD_TOKEN:-}" ]; then
            echo 'DISCLOUD_TOKEN is not configured for the discloud-production environment.'
            exit 1
          fi

      - name: Resolve DIScloud target application
        id: resolve_discloud_app
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: node scripts/discloud-resolve-app.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build deployment artifact
        run: npm run build

      - name: Run CI safety validations
        env:
          YUGABYTE_PASSWORD: test-ci-placeholder-password
        run: npx vitest run tests/auto-heal-watchdog.test.ts

      - name: Verify generated runtime artifact
        run: |
          test -f build/index.js
          if [ -n "$(git status --porcelain build/ ':!build/BUILD_ID')" ]; then
            echo 'Generated runtime files differ from their committed counterparts.'
            git diff -- build/ ':!build/BUILD_ID'
            exit 1
          fi

      - name: Commit reviewed runtime artifact to DIScloud
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ steps.resolve_discloud_app.outputs.app_id }}
          team: ${{ steps.resolve_discloud_app.outputs.is_team }}
          # Do not upload .env, source, tests, git metadata, or local caches.
          # Runtime configuration remains in DIScloud's protected environment.
          glob: |
            build/**
            discloud.config
            package.json
            package-lock.json
            README.md

      - name: Verify deployed runtime and site health
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ steps.resolve_discloud_app.outputs.app_id }}
          DISCLOUD_IS_TEAM: ${{ steps.resolve_discloud_app.outputs.is_team }}
        run: node scripts/discloud-verify-deployment.mjs
